# GNSS pipeline — global configuration
# key = value, # comments, пустые строки игнорируются
# Env override: GNSS_ROVER_ROOT, GNSS_BASE_ROOT, GNSS_EXPERIMENT

gnss_experiment = ~/gnss_experiment
rover_root      = ~/Documents/1_Data.nosync
base_root       = ~/Documents/2_Diff.nosync
outputs_root    = ~/gnss_pipeline_runs
batch_root      = ~/gnss_batch_runs

# Defaults (можно override через env)
n_jobs          = 6
segment_gap_sec = 300
segment_min_sec = 300
